name: Release

# 태그(v1.0.0 형식)를 push하거나, Actions 탭에서 버전을 입력해 직접 실행하면
# 시뮬레이터를 zip으로 묶어 GitHub 릴리즈를 만듭니다.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 (예: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::버전은 v1.0.0 형식이어야 합니다: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist/rps-simulator
          cp index.html README.md dist/rps-simulator/
          (cd dist && zip -r "rps-simulator-$TAG.zip" rps-simulator)
          cp index.html dist/index.html
          ls -l dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 가위바위보 첫수 시뮬레이터 ${{ steps.version.outputs.tag }}
          body: |
            가위바위보에서 첫 판에 가위·바위·보를 낼 때의 승률을 시뮬레이션하는 단일 HTML 페이지입니다.

            **사용법:** 아래 `index.html`을 내려받아 브라우저로 열면 됩니다. 설치는 필요 없습니다.
          generate_release_notes: true
          files: |
            dist/rps-simulator-${{ steps.version.outputs.tag }}.zip
            dist/index.html
